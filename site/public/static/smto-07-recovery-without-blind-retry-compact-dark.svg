<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">A missing reply is not a failed action.</title>
  <desc id="desc">SMTO dispatches an operation and the tool may change something. The return connection can fail after that change, leaving the outcome unknown. SMTO retains the uncertainty and checks available status, receipts or the actual result before deciding what to do next. A confirmed completed operation can continue without repeating it. A retry is appropriate only when the operation and evidence make it safe. An unresolved outcome remains unresolved and may require human input or further checking. The diagram deliberately does not promise automatic recovery, lossless crash persistence or exactly-once side effects.</desc>
