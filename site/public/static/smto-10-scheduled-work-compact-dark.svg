<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Schedule the work. Keep its context.</title>
  <desc id="desc">A task is saved with the context accepted for that work, including its selected target and model settings. A scheduled event can later make the task eligible to run. The controller drives the task using that context and the required execution checks. The selected Gateway or other execution route performs allowed work, and its results become part of the task record. Closing a browser tab does not stop the controller service. This does not promise execution while the controller is powered off, automatic target substitution, crash-time authorization revalidation, or an exact trigger time.</desc>
