<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">A missing reply is not a failed action.</title>
  <desc id="desc">SMTO dispatches an operation and the tool may change something. The return connection can fail after that change, leaving the outcome unknown. SMTO retains the uncertainty and checks available status, receipts or the actual result before deciding what to do next. A confirmed completed operation can continue without repeating it. A retry is appropriate only when the operation and evidence make it safe. An unresolved outcome remains unresolved and may require human input or further checking. The diagram deliberately does not promise automatic recovery, lossless crash persistence or exactly-once side effects.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#A5BDFF" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#88D6BA" />
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C6B5F2" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#E9C476" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#FFABB4" />
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#AEBBCD" />
    </marker>
  </defs>
  <rect width="1536" height="690" fill="#181818" />
  <g transform="translate(-32,-202)">
    <rect x="70" y="260" width="405" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="70" y="260" width="5" height="205" rx="2" fill="#A5BDFF" />
    <rect x="92" y="283" width="66" height="66" rx="17" fill="#26344F" />
    <g transform="translate(101,292) scale(0.75)" fill="none" stroke="#A5BDFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="48" height="48" rx="8" />
      <path d="M32 8v48M16 25h22m-6-6 6 6-6 6M48 40H26m6-6-6 6 6 6" />
    </g>
    <text x="178" y="305.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">Dispatch an</text>
    <text x="178" y="341.96" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">action</text>
    <text x="96" y="387.92" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">A tool may already change a</text>
    <text x="96" y="416.96" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">file or service.</text>
    <rect x="594" y="260" width="405" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="594" y="260" width="5" height="205" rx="2" fill="#E9C476" />
    <rect x="616" y="283" width="66" height="66" rx="17" fill="#423722" />
    <g transform="translate(625,292) scale(0.75)" fill="none" stroke="#E9C476" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="25" />
      <path d="M24 21v22m16-22v22" />
    </g>
    <text x="702" y="305.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">Reply</text>
    <text x="702" y="341.96" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">interrupted</text>
    <text x="620" y="387.92" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">The outcome can be unknown.</text>
    <path d="M475,362 H586" fill="none" stroke="#A5BDFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <rect x="1115" y="260" width="405" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="1115" y="260" width="5" height="205" rx="2" fill="#88D6BA" />
    <rect x="1137" y="283" width="66" height="66" rx="17" fill="#223C34" />
    <g transform="translate(1146,292) scale(0.75)" fill="none" stroke="#88D6BA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 8h24l10 10v38H17zM41 8v11h10M25 28h17m-17 9h17m-17 9h9" />
      <path d="m4 27 4 4 7-8m-11 22 4 4 7-8" />
    </g>
    <text x="1223" y="305.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#ECECEC">Reconcile the</text>
    <text x="1223" y="340.64" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#ECECEC">result</text>
    <text x="1141" y="385.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">Inspect status, receipts or</text>
    <text x="1141" y="414.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">actual output.</text>
    <path d="M999,362 H1107" fill="none" stroke="#E9C476" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" />
    <path d="M1316,465 V555 H800" fill="none" stroke="#88D6BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M800,555 H290 V633" fill="none" stroke="#88D6BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
    <rect x="80" y="640" width="420" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="80" y="640" width="5" height="205" rx="2" fill="#88D6BA" />
    <rect x="102" y="663" width="66" height="66" rx="17" fill="#223C34" />
    <g transform="translate(111,672) scale(0.75)" fill="none" stroke="#88D6BA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="25" />
      <path d="m18 32 10 10 19-22" />
    </g>
    <text x="188" y="685.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">Confirmed</text>
    <text x="188" y="721.96" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">complete</text>
    <text x="106" y="767.92" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">Do not repeat the action.</text>
    <path d="M800,555 H800 V633" fill="none" stroke="#A5BDFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <rect x="590" y="640" width="420" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="590" y="640" width="5" height="205" rx="2" fill="#A5BDFF" />
    <rect x="612" y="663" width="66" height="66" rx="17" fill="#26344F" />
    <g transform="translate(621,672) scale(0.75)" fill="none" stroke="#A5BDFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 6 53 14v17c0 12-9 22-21 28C20 53 11 43 11 31V14z" />
      <path d="m22 31 7 7 14-15" />
    </g>
    <text x="698" y="685.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">Safe to retry</text>
    <text x="616" y="744.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">Only when evidence permits.</text>
    <path d="M800,555 H1310 V633" fill="none" stroke="#E9C476" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" />
    <rect x="1100" y="640" width="420" height="205" rx="18" fill="#22252B" stroke="#465164" stroke-width="1.5" />
    <rect x="1100" y="640" width="5" height="205" rx="2" fill="#E9C476" />
    <rect x="1122" y="663" width="66" height="66" rx="17" fill="#423722" />
    <g transform="translate(1131,672) scale(0.75)" fill="none" stroke="#E9C476" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="25" />
      <path d="M24 21v22m16-22v22" />
    </g>
    <text x="1208" y="685.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#ECECEC">Still unresolved</text>
    <text x="1126" y="744.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#AEBBCD">Retain uncertainty; ask or pause.</text>
  </g>
</svg>
