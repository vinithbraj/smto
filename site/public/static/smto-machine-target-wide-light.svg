<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 530" width="1220" height="530" role="img" aria-labelledby="title desc"><title id="title">SMTO computer selection</title><desc id="desc">A task can be assigned to a connected laptop, workstation, or server. Workstation is selected as an illustration; other computers do not automatically share files.</desc><rect x="1" y="1" width="1218" height="528" rx="25" fill="#FAFBFD" stroke="#DCE3EE" stroke-width="2"/><text x="66" y="66" fill="#4464DE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1.5">ONE WORKSPACE · CHOOSE A COMPUTER</text><text x="66" y="110" fill="#151C29" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="680" text-anchor="start" letter-spacing="0">A task runs where you choose.</text><rect x="68" y="164" width="385" height="272" rx="22" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="2"/><rect x="97" y="196" width="65" height="65" rx="16" fill="#EDF1FF"/><rect x="110" y="210" width="13" height="13" rx="3" fill="#4464DE"/><rect x="133" y="210" width="13" height="13" rx="3" fill="#4464DE"/><rect x="110" y="233" width="13" height="13" rx="3" fill="#4464DE"/><rect x="133" y="233" width="13" height="13" rx="3" fill="#4464DE"/><text x="97" y="311" fill="#151C29" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="670" text-anchor="start" letter-spacing="0">SMTO workspace</text><text x="97" y="348" fill="#4C596C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0">Your request, activity and results</text><text x="97" y="386" fill="#647184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">One task · one selected target</text><path d="M453 304 H550 V273 H659" fill="none" stroke="#4464DE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="550" cy="304" r="8" fill="#4464DE"/><path d="M550 304 V185 H659" fill="none" stroke="#DCE3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 10"/><path d="M550 304 V385 H659" fill="none" stroke="#DCE3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 10"/><rect x="660" y="158" width="490" height="83" rx="18" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="2"/><rect x="684" y="177" width="44" height="43" rx="10" fill="#F2F5FA"/><path d="M694 187 H716 V205 H694 Z" fill="none" stroke="#4C596C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 209 L720 209" fill="none" stroke="#4C596C" stroke-width="2" stroke-linecap="round"/><text x="750" y="195" fill="#151C29" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="650" text-anchor="start" letter-spacing="0">Laptop</text><text x="750" y="220" fill="#4C596C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Everyday work</text><rect x="660" y="257" width="490" height="83" rx="18" fill="#ECF2FF" stroke="#4464DE" stroke-width="3"/><rect x="684" y="276" width="44" height="43" rx="10" fill="#EDF1FF"/><rect x="695" y="285" width="22" height="17" rx="2" fill="none" stroke="#4464DE" stroke-width="2"/><path d="M706 302 L706 306" fill="none" stroke="#4464DE" stroke-width="2" stroke-linecap="round"/><path d="M699 307 L713 307" fill="none" stroke="#4464DE" stroke-width="2" stroke-linecap="round"/><text x="750" y="294" fill="#151C29" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="650" text-anchor="start" letter-spacing="0">Workstation</text><text x="750" y="319" fill="#4C596C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Selected for this task</text><circle cx="1114" cy="299" r="8" fill="#4464DE"/><rect x="660" y="356" width="490" height="83" rx="18" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="2"/><rect x="684" y="375" width="44" height="43" rx="10" fill="#F2F5FA"/><rect x="695" y="383" width="22" height="8" rx="2" fill="none" stroke="#4C596C" stroke-width="2"/><circle cx="701" cy="387" r="1.5" fill="#4C596C"/><rect x="695" y="394" width="22" height="8" rx="2" fill="none" stroke="#4C596C" stroke-width="2"/><circle cx="701" cy="398" r="1.5" fill="#4C596C"/><text x="750" y="393" fill="#151C29" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="650" text-anchor="start" letter-spacing="0">Server</text><text x="750" y="418" fill="#4C596C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Long-running work</text><text x="67" y="481" fill="#4C596C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Each connected computer keeps its own files and permissions. Selection is not file sharing.</text></svg>