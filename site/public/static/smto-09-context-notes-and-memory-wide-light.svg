    <text x="178" y="292.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Saved tool results</text>
    <text x="96" y="351.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5C5C5C">Read retained results again.</text>
    <path d="M295,460 V551 H800 V615" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <rect x="575" y="247" width="450" height="212" rx="18" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.5" />
    <rect x="575" y="247" width="5" height="212" rx="2" fill="#166C59" />
    <rect x="597" y="270" width="66" height="66" rx="17" fill="#EAF6F1" />
    <g transform="translate(606,279) scale(0.75)" fill="none" stroke="#166C59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
