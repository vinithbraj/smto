    <text x="601" y="351.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5C5C5C">Agent KV for this conversation.</text>
    <path d="M800,460 V551 H800 V615" fill="none" stroke="#166C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
