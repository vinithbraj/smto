    <rect x="520" y="623" width="5" height="187" rx="2" fill="#6751A7" />
    <rect x="542" y="646" width="66" height="66" rx="17" fill="#F2EEFB" />
    <g transform="translate(551,655) scale(0.75)" fill="none" stroke="#6751A7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 11c-8-10-20-2-17 8-10 1-12 16-4 21-5 10 8 20 17 14l5-6V15c3-12 17-12 20-2 7 2 9 12 4 17 10 9 3 23-7 21-3 10-15 8-17 0M20 16c0 6 4 10 10 10M12 31c8-2 12 2 12 9M17 50c6 0 10-4 10-9M43 17c-4 4-4 9 0 13M50 39c-8-1-11 3-11 9" />
    </g>
    <text x="628" y="668.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#202020">Selected model context</text>
    <text x="546" y="727.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#5C5C5C">Useful information within the model’s input</text>
    <text x="546" y="757.36" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#5C5C5C">limit.</text>
    <text x="60" y="665.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2B2B2B">RECORD ≠ CONTEXT</text>
    <text x="60" y="713.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5C5C5C">Saved does not mean</text>
    <text x="60" y="744.68" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5C5C5C">already read by the model.</text>
    <text x="1170" y="665.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#835800">REUSE ≠ CURRENT FACT</text>
    <text x="1170" y="713.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5C5C5C">Check stale information</text>
    <text x="1170" y="744.68" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5C5C5C">when it matters.</text>
  </g>
</svg>
