    <rect x="92" y="270" width="66" height="66" rx="17" fill="#EFEFEF" />
    <g transform="translate(101,279) scale(0.75)" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
