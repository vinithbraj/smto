    <text x="1188" y="292.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Reusable memory</text>
    <text x="1106" y="351.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5C5C5C">Relevant information for later tasks.</text>
