<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Give smaller models a structured way to act.</title>
  <desc id="desc">SMTO provides a structured environment around a configured model. Relevant tool choices reduce the need to describe unrelated tools. Recorded results can be presented as useful observations while the saved record remains distinct from the model's bounded context. Permissions and explicit task state help manage actions and unfinished work outside the model itself. A smaller model still needs to understand the task and use tools competently; model capabilities differ. Larger compatible models can use the same runtime. The illustration contains no benchmark, performance multiplier or guarantee that these mechanisms make a weak model equivalent to a stronger one.</desc>
