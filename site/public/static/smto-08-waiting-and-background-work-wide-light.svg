<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Waiting is a state, not more thinking.</title>
  <desc id="desc">A short tool action returns its result when it finishes. A supported long-running action can be tracked as saved background work; SMTO can resume the task when the relevant result or event arrives. When an answer or approval is required from you, the task retains its progress and waits for your input. It does not need repeated model calls merely to remain in the waiting state. Closing the original browser tab is not the same as stopping the controller. The controller, target Gateway, model connection and tools still need to be available as required. These paths are conceptual and make no timing or latency guarantee.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2B2B2B" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#166C59" />
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6751A7" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#835800" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B02D3A" />
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5C5C5C" />
    </marker>
  </defs>
  <rect width="1536" height="690" fill="#FFFFFF" />
