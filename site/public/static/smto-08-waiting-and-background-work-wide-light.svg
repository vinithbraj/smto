    <text x="737" y="733.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Save a pause</text>
    <text x="737" y="779.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#5C5C5C">Wait for your response</text>
    <path d="M1064,750 H1116" fill="none" stroke="#835800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" />
    <text x="1129" y="733.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Your reply arrives</text>
    <text x="1129" y="779.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#5C5C5C">Continue within scope</text>
  </g>
