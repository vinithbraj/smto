    <text x="345" y="309.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Run tool</text>
    <text x="345" y="355.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#5C5C5C">Allowed action</text>
    <path d="M672,326 H724" fill="none" stroke="#166C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
    <text x="737" y="309.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#202020">Tool finishes</text>
    <text x="737" y="355.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#5C5C5C">Result is available</text>
    <path d="M1064,326 H1116" fill="none" stroke="#166C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
