<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Reasoning is not execution.</title>
  <desc id="desc">The AI model reads the request, chooses a next step, interprets tool information and proposes an answer. SMTO presents available tools, checks permissions, dispatches allowed operations and records their results. A selected Gateway or other supported execution route performs the action. The controller sends observations back to the model to inform the next step. Either local or compatible online model connections can be configured. The model and the controller are not the same subsystem, and a finished tool action does not by itself prove that the model's answer is correct.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3F63CF" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#166C59" />
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6751A7" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#835800" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B02D3A" />
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#526078" />
    </marker>
  </defs>
  <rect width="1536" height="690" fill="#FFFFFF" />
  <g transform="translate(-32,-202)">
    <rect x="65" y="245" width="710" height="515" rx="24" fill="#F2EEFB" stroke="#6751A7" stroke-width="1.5" />
    <g transform="translate(103,278) scale(1.21875)" fill="none" stroke="#6751A7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 11c-8-10-20-2-17 8-10 1-12 16-4 21-5 10 8 20 17 14l5-6V15c3-12 17-12 20-2 7 2 9 12 4 17 10 9 3 23-7 21-3 10-15 8-17 0M20 16c0 6 4 10 10 10M12 31c8-2 12 2 12 9M17 50c6 0 10-4 10-9M43 17c-4 4-4 9 0 13M50 39c-8-1-11 3-11 9" />
    </g>
    <text x="208" y="305.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#6751A7">01 / THE MODEL</text>
    <text x="208" y="348.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#202020">Chooses what to try.</text>
    <circle cx="119" cy="427" r="5" fill="#6751A7" />
    <text x="145" y="433.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Understand the request</text>
    <circle cx="119" cy="494" r="5" fill="#6751A7" />
    <text x="145" y="500.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Choose a tool or next action</text>
    <circle cx="119" cy="561" r="5" fill="#6751A7" />
    <text x="145" y="567.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Interpret returned information</text>
    <circle cx="119" cy="628" r="5" fill="#6751A7" />
    <text x="145" y="634.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Propose the next response</text>
    <rect x="825" y="245" width="710" height="515" rx="24" fill="#EDF2FF" stroke="#3F63CF" stroke-width="1.5" />
    <g transform="translate(863,278) scale(1.21875)" fill="none" stroke="#3F63CF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="13" y="13" width="38" height="38" rx="10" />
      <path d="M23 23h18v18H23zM23 5v8m9-8v8m9-8v8M23 51v8m9-8v8m9-8v8M5 23h8m-8 9h8m-8 9h8m38-18h8m-8 9h8m-8 9h8" />
    </g>
    <text x="968" y="305.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#3F63CF">02 / THE RUNTIME</text>
    <text x="968" y="348.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#202020">Makes allowed action possible.</text>
    <circle cx="879" cy="427" r="5" fill="#3F63CF" />
    <text x="905" y="433.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Present relevant tools</text>
    <circle cx="879" cy="494" r="5" fill="#3F63CF" />
    <text x="905" y="500.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Check permission and target</text>
    <circle cx="879" cy="561" r="5" fill="#3F63CF" />
    <text x="905" y="567.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Execute and record operations</text>
    <circle cx="879" cy="628" r="5" fill="#3F63CF" />
    <text x="905" y="634.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202020">Return useful observations</text>
    <path d="M430,790 H1170" fill="none" stroke="#3F63CF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
    <text x="805" y="823.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#3F63CF">decisions → allowed actions → observations</text>
  </g>
</svg>
