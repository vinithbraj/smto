<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Reasoning is not execution.</title>
  <desc id="desc">The AI model reads the request, chooses a next step, interprets tool information and proposes an answer. SMTO presents available tools, checks permissions, dispatches allowed operations and records their results. A selected Gateway or other supported execution route performs the action. The controller sends observations back to the model to inform the next step. Either local or compatible online model connections can be configured. The model and the controller are not the same subsystem, and a finished tool action does not by itself prove that the model's answer is correct.</desc>
