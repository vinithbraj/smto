<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">The architecture behind the task.</title>
  <desc id="desc">The browser is the user interface to the controller. A separately configured model endpoint supplies model decisions; SMTO does not include the model. Inside the controller, the conceptual responsibilities are task state, tool selection, permission and execution checks, and result observations. Saved progress, context and memory, and activity history support those responsibilities. A selected Gateway executes machine-local tools and returns results. Controller-local tools and service integrations are separate execution routes. These are responsibility boundaries, not a promise that every block is a separate service or storage engine. The independent public website serves documentation and downloads, not live task execution.</desc>
