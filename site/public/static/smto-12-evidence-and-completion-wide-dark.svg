<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Finished work should leave a record.</title>
  <desc id="desc">Recorded operations provide tool results, errors and output references. Supported completion checks can inspect required outputs and unresolved operations, human input or work still in progress. An optional Task Contract records intended requirements but is not a proof of success. The outcome report should distinguish complete work, partial work, failure and cancellation as appropriate; these are explanatory categories, not exact internal enum names. The model remains responsible for much of the semantic assessment, and the user should compare important results with the original task. Activity history is not the model's private reasoning.</desc>
