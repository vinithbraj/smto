# Publish the SMTO website: copy site/public to the gh-pages branch, which GitHub
# Pages serves at https://vinithbraj.github.io/smto/.
#
# site/public is generated locally by site/tools/build_site.py from the openfabric
# source and committed to main; this workflow only checks it and publishes it. It
# checks out site/ alone (sparse), so the Git LFS release binaries are never
# downloaded. gh-pages always holds exactly one commit: the current site.
#
# Manual fallback (same result, from your machine): site/tools/publish_gh_pages.sh
name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "site/public/**"
      - "site/tools/check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; never cancel a publish that is already running.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website only
        uses: actions/checkout@v5
        with:
          sparse-checkout: site
          lfs: false

      - name: Work out the public URL
        id: site
        run: |
          if [ -f site/public/CNAME ]; then
            echo "url=https://$(tr -d '[:space:]' < site/public/CNAME)" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check links, assets and URLs
        run: python3 site/tools/check_site.py site/public --site-url "${{ steps.site.outputs.url }}"

      - name: Publish site/public to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish="$RUNNER_TEMP/gh-pages"
          cp -a site/public "$publish"
          cd "$publish"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish SMTO website (site/public from main ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to ${{ steps.site.outputs.url }}/" >> "$GITHUB_STEP_SUMMARY"
