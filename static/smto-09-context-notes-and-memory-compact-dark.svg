<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Keep the record. Focus the context.</title>
  <desc id="desc">The model has a bounded context window. Saved tool results preserve records that may be read again without placing every byte into every model request. Conversation notes, called Agent KV in technical settings, help within the conversation and are not necessarily included automatically in each request. The Memory feature can retain useful information across conversations and retrieve it when relevant. These are different stores or roles, not synonyms for the model's context window. Saved information can be outdated, and retrieved memory may be sent to the configured model provider. Important current facts still require current evidence.</desc>
