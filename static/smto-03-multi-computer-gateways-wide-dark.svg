<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Many computers. Clear boundaries.</title>
  <desc id="desc">A single SMTO controller can retain connections to multiple Gateways. In the example, task A selects Gateway A on a laptop to use local files, task B selects Gateway B on a workstation to run local programs, and task C selects Gateway C on a server to work with server files. Their results return to the controller. A Gateway is an execution target, not an AI model. The diagram does not instruct one task to broadcast to all machines. A different target does not inherit another computer's files, paths, credentials or permissions. Each computer needs its own available Gateway and installed tools. A saved connection does not prove that it is online.</desc>
