<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Start small. Connect the right parts.</title>
  <desc id="desc">Install and run the SMTO controller according to the project guides. Configure a supported model endpoint, either local or online. Prepare and select the Gateway on the computer where machine-local tools should run; install the tools and provide required permissions. Start with a small task, such as reading notes and saving a summary, whose result you can inspect. The controller, model and Gateway can share one computer or be separated. This map does not replace operating-system-specific installation instructions and does not imply that downloads contain a model or every optional tool.</desc>
