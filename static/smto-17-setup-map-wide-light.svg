    <text x="173" y="324.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#202020">Run SMTO</text>
    <text x="91" y="371.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526078">Install the controller from the guides.</text>
