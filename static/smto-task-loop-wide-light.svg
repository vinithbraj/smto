<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 450" width="1220" height="450" role="img" aria-labelledby="title desc"><title id="title">SMTO task execution loop</title><desc id="desc">A request goes to an AI model, which chooses a step. SMTO checks access and runs tools. Tool results return to the model. The user reviews the outcome and activity.</desc><rect x="1" y="1" width="1218" height="448" rx="25" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/><text x="58" y="62" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="1.4">FROM REQUEST TO RESULT</text><rect x="55" y="116" width="265" height="188" rx="18" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/><rect x="73" y="136" width="45" height="36" rx="9" fill="#F0F0F0"/><text x="95" y="159" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">01</text><text x="76" y="217" fill="#161616" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="690" text-anchor="start" letter-spacing="0">You ask</text><text x="76" y="254" fill="#5C5C5C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Describe the outcome</text><path d="M324 208 L342 208" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"/><path d="M336 203 L343 208 L336 213" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="116" width="265" height="188" rx="18" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/><rect x="368" y="136" width="45" height="36" rx="9" fill="#F0F0F0"/><text x="390" y="159" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">02</text><text x="371" y="217" fill="#161616" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="690" text-anchor="start" letter-spacing="0">AI model</text><text x="371" y="254" fill="#5C5C5C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Chooses the next step</text><path d="M619 208 L637 208" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/><path d="M631 203 L638 208 L631 213" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="645" y="116" width="265" height="188" rx="18" fill="#F3F3F3" stroke="#171717" stroke-width="2"/><rect x="663" y="136" width="45" height="36" rx="9" fill="#F0F0F0"/><text x="685" y="159" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">03</text><text x="666" y="217" fill="#161616" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="690" text-anchor="start" letter-spacing="0">SMTO + tools</text><text x="666" y="254" fill="#5C5C5C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Checks and carries out work</text><path d="M914 208 L932 208" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"/><path d="M926 203 L933 208 L926 213" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="940" y="116" width="265" height="188" rx="18" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/><rect x="958" y="136" width="45" height="36" rx="9" fill="#F0F0F0"/><text x="980" y="159" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">04</text><text x="961" y="217" fill="#161616" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="690" text-anchor="start" letter-spacing="0">Tool result</text><text x="961" y="254" fill="#5C5C5C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">Informs the next step</text><path d="M1092 314 V354 H363 V310" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9"/><circle cx="363" cy="310" r="6" fill="#171717"/><text x="740" y="383" fill="#5C5C5C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Observed results return to the model for follow-up steps.</text><text x="58" y="420" fill="#8A8A8A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">You review the outcome and the activity behind it.</text></svg>