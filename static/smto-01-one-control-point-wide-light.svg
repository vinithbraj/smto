<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Your work. One control point.</title>
  <desc id="desc">You use a browser to direct work through the SMTO controller. The controller asks a configured AI model for the next step and manages allowed tool execution. It can connect to Gateways on more than one computer. Three example targets are a laptop, a workstation, and a server; these are illustrative roles, not detected devices. A task uses its selected Gateway, and a result returns to the controller. The browser, controller, model and Gateway may share a computer or run separately. Some tools run inside SMTO or connect to services instead of using a Gateway. Files are not automatically shared between computers. The public SMTO website is not the controller.</desc>
