<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">SMTO • From reasoning to real work</title>
  <desc id="desc">The poster combines six ideas. A browser directs a controller, which works with a separately configured model and selected Gateways. Different Gateways expose the files and tools on their own computers. The model-led loop chooses an action, checks access, executes the tool, records its result and returns information for the next step. Permissions, saved progress, context and memory, and activity history support the loop. Example uses include file-based work, source-based research and developer tasks. Supported completion checks and human review help identify unfinished or incorrect work, but do not prove every answer correct. Optional online model and tool connections can send data outside the local deployment.</desc>
