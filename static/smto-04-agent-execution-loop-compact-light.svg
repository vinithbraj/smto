<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">How a request becomes action.</title>
  <desc id="desc">First, SMTO accepts the request and task settings. Second, the model chooses a tool or next action. Third, SMTO checks access and prerequisites. Fourth, the tool runs on the selected execution route. Fifth, the result, error or unclear outcome is recorded. Sixth, information from the recorded result is sent to the model. Seventh, the model can choose another action, ask for input, or propose an answer. Another action returns to the model decision and permission checks. Eighth, supported completion checks examine required results and outstanding work before the task can finish. This sequence is conceptual; an optional Task Contract is not a substitute for the loop and is not a guarantee of correctness.</desc>
