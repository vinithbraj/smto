<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Many computers. Clear boundaries.</title>
  <desc id="desc">A single SMTO controller can retain connections to multiple Gateways. In the example, task A selects Gateway A on a laptop to use local files, task B selects Gateway B on a workstation to run local programs, and task C selects Gateway C on a server to work with server files. Their results return to the controller. A Gateway is an execution target, not an AI model. The diagram does not instruct one task to broadcast to all machines. A different target does not inherit another computer's files, paths, credentials or permissions. Each computer needs its own available Gateway and installed tools. A saved connection does not prove that it is online.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#A5BDFF" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#88D6BA" />
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C6B5F2" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#E9C476" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#FFABB4" />
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#AEBBCD" />
    </marker>
  </defs>
