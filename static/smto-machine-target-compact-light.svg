<svg xmlns="http://www.w3.org/2000/svg" width="400" height="540" viewBox="0 0 400 540" role="img" aria-labelledby="title desc"><title id="title">Choose a computer for the task</title><desc id="desc">SMTO selects one computer for a task. The workstation is selected here. Laptop and server remain options, not simultaneous execution targets.</desc><rect x="1" y="1" width="398" height="538" rx="20" fill="#FFFFFF" stroke="#E2E2E2"/><text x="24" y="38" fill="#171717" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">ONE TASK. ONE TARGET.</text><rect x="20" y="60" width="360" height="92" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/><text x="200" y="95" fill="#161616" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="650" text-anchor="middle">SMTO workspace</text><text x="200" y="125" fill="#5C5C5C" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Choose a computer for the task</text><path d="M200 157v22m-5-5 5 5 5-5" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="196" width="316" height="76" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/><text x="62" y="227" fill="#161616" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">Laptop</text><text x="62" y="253" fill="#5C5C5C" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="start">Available</text><rect x="42" y="287" width="316" height="76" rx="14" fill="#F0F0F0" stroke="#171717" stroke-width="2"/><text x="62" y="318" fill="#161616" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">Workstation</text><text x="62" y="344" fill="#171717" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="start">Selected for this task</text><rect x="42" y="378" width="316" height="76" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/><text x="62" y="409" fill="#161616" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">Server</text><text x="62" y="435" fill="#5C5C5C" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="start">Available</text><text x="24" y="495" fill="#5C5C5C" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Each computer keeps its own</text><text x="24" y="521" fill="#5C5C5C" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">files, tools and permissions.</text></svg>
