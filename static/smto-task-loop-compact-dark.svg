<svg xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">SMTO task steps</title><desc id="desc">The model chooses a step. SMTO checks access and uses tools. Results return to the model; you review the work.</desc><rect x="1" y="1" width="398" height="548" rx="20" fill="#11141B" stroke="#374353"/><text x="24" y="38" fill="#A0AFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">FROM REQUEST TO RESULT</text><rect x="20" y="60" width="360" height="84" rx="14" fill="#1C222D" stroke="#374353" stroke-width="1"/><text x="38" y="91" fill="#A0AFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">01</text><text x="80" y="91" fill="#F5F7FC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">You ask</text><text x="38" y="122" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Describe the outcome</text><path d="M200 147v22m-5-5 5 5 5-5" fill="none" stroke="#A0AFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="171" width="360" height="84" rx="14" fill="#1C222D" stroke="#374353" stroke-width="1"/><text x="38" y="202" fill="#A0AFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">02</text><text x="80" y="202" fill="#F5F7FC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">AI model</text><text x="38" y="233" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Chooses the next step</text><path d="M200 258v22m-5-5 5 5 5-5" fill="none" stroke="#A0AFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="282" width="360" height="84" rx="14" fill="#293453" stroke="#A0AFFF" stroke-width="2"/><text x="38" y="313" fill="#A0AFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">03</text><text x="80" y="313" fill="#F5F7FC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">SMTO + tools</text><text x="38" y="344" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Checks and carries out work</text><path d="M200 369v22m-5-5 5 5 5-5" fill="none" stroke="#A0AFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="393" width="360" height="84" rx="14" fill="#1C222D" stroke="#374353" stroke-width="1"/><text x="38" y="424" fill="#A0AFFF" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">04</text><text x="80" y="424" fill="#F5F7FC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650" text-anchor="start">Tool result</text><text x="38" y="455" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Informs the next step</text><text x="24" y="508" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">Results guide the model.</text><text x="24" y="534" fill="#B7C2D3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" text-anchor="start">You review the work.</text></svg>
