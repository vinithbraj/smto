<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="690" viewBox="0 0 1536 690" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Available does not mean authorized.</title>
  <desc id="desc">An installed tool is present in the setup. A selected tool is relevant to the task. An allowed tool is within the task's permissions. Approved means that any required approval for the particular action has been given. Connected means that the needed computer or account is available. These are separate conditions rather than a single enable switch. A model can request more capability access, but it cannot grant itself that access. Depending on the policy, an action can run, wait for the user's decision, or be blocked. Permission does not authenticate an account or prove that an action succeeded. The checks are shown conceptually, not in a guaranteed code execution order.</desc>
